<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3. Sınıf Hayat Bilgisi | Görsel Konu Özetleri</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5ff;color:#203451;font:16px system-ui,Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}a{color:#1756a5;font-weight:700}.cover{width:100%;display:block;border-radius:16px;margin:12px auto;max-height:390px;object-fit:contain}.panel{background:white;border-radius:14px;padding:15px;margin:12px 0;box-shadow:0 3px 15px #243b5315}.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:5px;font-size:13px;font-weight:700}.field.topic{flex:1;min-width:240px}select,button{padding:11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}select{width:100%;background:white}button{background:#2364ca;color:white;border:0;font-weight:700;cursor:pointer}.choices{display:flex;gap:4px;flex-wrap:wrap}.choices button{background:#edf3ff;color:#24416a;border:1px solid #cbd8ec}.choices button.active{background:#2364ca;color:white}.paper{background:white;box-shadow:0 2px 14px #0002;margin:14px auto;display:grid;overflow:hidden;width:min(100%,560px);aspect-ratio:210/297}.paper.landscape{width:min(100%,790px);aspect-ratio:297/210}.paper img{width:100%;height:100%;object-fit:contain;min-width:0;min-height:0}.paper[data-count="1"]{grid-template-columns:1fr;grid-template-rows:1fr}.paper[data-count="2"]{grid-template-columns:1fr;grid-template-rows:repeat(2,1fr)}.paper.landscape[data-count="2"]{grid-template-columns:repeat(2,1fr);grid-template-rows:1fr}.paper[data-count="4"]{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr)}.muted{font-size:13px;color:#617187}.error{padding:40px;text-align:center;color:#a33232}.printarea{display:none}#fullscreenView{display:none;position:fixed;inset:0;background:#10151e;z-index:10000;align-items:center;justify-content:center}#fullscreenView img{width:100%;height:100%;object-fit:contain}#exitFullscreen{position:absolute;right:14px;top:14px;z-index:1;background:white;color:#172b45}#fullscreenView:fullscreen{display:flex}
@page{size:auto;margin:0}@media print{html,body{margin:0!important;padding:0!important;background:white!important}.wrap,#fullscreenView{display:none!important}.printarea{display:block!important;margin:0!important;padding:0!important}.printarea .paper{width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;margin:0!important;box-shadow:none!important;break-inside:avoid;page-break-inside:avoid}.printarea.portrait{width:210mm;height:297mm}.printarea.landscape{width:297mm;height:210mm}}
</style></head><body><main class="wrap"><header><a href="konu-ozetleri-ve-defter-etkinlikleri.html">← Konu Özetlerine Dön</a><strong>3. Sınıf Hayat Bilgisi</strong></header><img class="cover" src="hayat-bilgisi-kapak.png" alt="3. Sınıf Hayat Bilgisi Görsel Konu Özetleri"><section class="panel"><h2>Görsel Konu Özetleri</h2><div class="controls"><label class="field topic">Konu seç<select id="topic"></select></label><div class="field">A4'te kopya<div class="choices" id="copies"><button type="button" data-value="1" class="active">1</button><button type="button" data-value="2">2</button><button type="button" data-value="4">4</button></div></div><div class="field">Sayfa yönü<div class="choices" id="orientation"><button type="button" data-value="portrait" class="active">Dikey</button><button type="button" data-value="landscape">Yatay</button></div></div><button type="button" id="fullscreen">⛶ Tam Ekran</button><button type="button" id="print">🖨 Yazdır</button></div><p class="muted">Seçimleriniz aşağıdaki A4 önizlemesine anında yansır. Tam Ekran yalnızca konu görselini gösterir.</p></section><section class="panel"><div id="paper" class="paper" data-count="1"></div><div id="status" class="muted" role="status"></div></section></main><div id="printarea" class="printarea portrait"><div id="printpaper" class="paper" data-count="1"></div></div><div id="fullscreenView"><button id="exitFullscreen" type="button">✕ Çıkış</button><img id="fullscreenImage" alt="Tam ekran konu özeti"></div><script>
const units=[['Ben ve Okulum',[['Güçlüyüm, Gelişiyorum','01.png'],['Hakkım da Var, Sorumluluğum da','02.png'],['Çocuğum, Haklarımla Varım','03.png']]],['Sağlığım ve Güvenliğim',[['Sağlığımı Koruyorum','04.png'],['Güvenliğimizi Tehdit Eden Durumlar','05.png'],['Trafik Kurallarının Önemi','06.png']]],['Ailem ve Toplum',[['Aile ve Toplum','07.png'],['Yardımlaşma','08.png'],['Meslekler','09.png']]]];
const topics=[],sel=document.getElementById('topic'),paper=document.getElementById('paper'),printpaper=document.getElementById('printpaper'),printarea=document.getElementById('printarea'),status=document.getElementById('status');for(const [unit,items] of units){const group=document.createElement('optgroup');group.label=unit;for(const [name,file] of items){topics.push({name,src:'hayat-bilgisi-gorselleri/'+file});group.append(new Option(name,topics.length-1))}sel.append(group)}let count=1,orientation='portrait',ready=false,loadedSrc='';function fill(target,src){target.replaceChildren();target.dataset.count=count;target.classList.toggle('landscape',orientation==='landscape');for(let i=0;i<count;i++){const im=new Image();im.src=src;im.alt=topics[+sel.value].name;target.append(im)}}function update(){const {name,src}=topics[+sel.value];ready=false;status.textContent='Görsel yükleniyor…';const img=new Image();img.onload=()=>{if(src!==topics[+sel.value].src)return;loadedSrc=src;ready=true;fill(paper,src);fill(printpaper,src);status.textContent=name};img.onerror=()=>{if(src!==topics[+sel.value].src)return;paper.innerHTML='<div class="error">Görsel bulunamadı: '+src+'</div>';printpaper.replaceChildren();status.textContent='GitHub klasörünü ve dosya adını kontrol edin.'};img.src=src}sel.onchange=update;for(const id of ['copies','orientation']){document.getElementById(id).addEventListener('click',e=>{const b=e.target.closest('button[data-value]');if(!b)return;for(const x of b.parentNode.querySelectorAll('button'))x.classList.toggle('active',x===b);if(id==='copies')count=Number(b.dataset.value);else orientation=b.dataset.value;printarea.className='printarea '+orientation;if(ready){fill(paper,loadedSrc);fill(printpaper,loadedSrc)}})}document.getElementById('print').onclick=()=>{if(!ready){alert('Görsel henüz yüklenmedi.');return}window.print()};const view=document.getElementById('fullscreenView');document.getElementById('fullscreen').onclick=async()=>{if(!ready){alert('Görsel henüz yüklenmedi.');return}document.getElementById('fullscreenImage').src=loadedSrc;view.style.display='flex';try{if(view.requestFullscreen)await view.requestFullscreen()}catch(e){}};document.getElementById('exitFullscreen').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});view.style.display='none'};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)view.style.display='none'});update();
</script></body></html>
