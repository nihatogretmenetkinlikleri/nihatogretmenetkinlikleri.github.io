function dataVisual(kind,vals){
 const labels=["Pzt","Sal","Çar","Per"];
 if(kind==="table"){
  return `<span class="data-vis"><table><tr><th>Gün</th>${labels.map(x=>`<th>${x}</th>`).join("")}</tr><tr><th>Sayı</th>${vals.map(x=>`<td>${x}</td>`).join("")}</tr></table></span>`;
 }
 let mx=Math.max(...vals), bars=vals.map((v,i)=>`<span class="barwrap"><em>${v}</em><i style="height:${Math.max(10,Math.round(v/mx*36))}px"></i><b>${labels[i]}</b></span>`).join("");
 return `<span class="data-vis chart"><span class="bararea">${bars}</span></span>`;
}

function tally(n){
 let groups=Math.floor(n/5), rem=n%5, parts=[];
 for(let g=0;g<groups;g++){
   parts.push(`<svg class="tallysvg" viewBox="0 0 26 18" aria-hidden="true">
    <path d="M3 2V16 M9 2V16 M15 2V16 M21 2V16 M1 15L23 3" fill="none" stroke="#111" stroke-width="1.7"/>
   </svg>`);
 }
 if(rem){
   let xs=[4,10,16,22].slice(0,rem), paths=xs.map(x=>`M${x} 2V16`).join(" ");
   parts.push(`<svg class="tallysvg rem" viewBox="0 0 26 18" aria-hidden="true"><path d="${paths}" fill="none" stroke="#111" stroke-width="1.7"/></svg>`);
 }
 return `<span class="tallymarks">${parts.join("")}</span>`;
}
function tallyTable(vals){
 const labs=["Kitap","Oyun","Spor","Müzik"];
 return `<span class="data-vis tally"><table><tr><th>Tercih</th><th>Çetele</th><th>Sayı</th></tr>`+
 vals.map((v,i)=>`<tr><th>${labs[i]}</th><td>${tally(v)}</td><td>${v}</td></tr>`).join("")+`</table></span>`;
}

function lvl(){return $("level").value}
function qmc(correct, wrongs){
 let vals=[correct,...wrongs].filter((v,i,a)=>a.indexOf(v)===i).slice(0,4);
 while(vals.length<4) vals.push(correct+vals.length+2);
 vals.sort(()=>Math.random()-.5);
 return [vals,vals.indexOf(correct)]
}

function fenQuestion(topic){

 let cyc=fenCycles[topic][L]||[];
 if(!cyc.length)cyc=[...Array(eligible.length).keys()].sort(()=>Math.random()-.5);
 let idx=cyc.shift();fenCycles[topic][L]=cyc;return eligible[idx];
}

 let pairs=q[1].map((v,i)=>({v,ok:i===q[2]})).sort(()=>Math.random()-.5);
 return [q[0],pairs.map(x=>x.v),pairs.findIndex(x=>x.ok)];
}

function turk2ReadingQuestion(){
 const level=$('level').value;
 const bank=level==='Kolay'?TURK2_BANK['Okuduğunu Anlama']:(TURK2_READING_LEVELS[level]||TURK2_READING_LEVELS['Orta']);
 const q=bank[Math.floor(Math.random()*bank.length)];
 let pairs=q[1].map((v,i)=>({v,ok:i===q[2]})).sort(()=>Math.random()-.5);
 return [q[0],pairs.map(x=>x.v),pairs.findIndex(x=>x.ok)];
}

function turk2Question(topic){
 const b=TURK2_BANK[topic]||TURK2_BANK["Harf ve Hece Bilgisi"];
 const q=b[Math.floor(Math.random()*b.length)];
 let pairs=q[1].map((v,i)=>({v,ok:i===q[2]})).sort(()=>Math.random()-.5);
 return [q[0],pairs.map(x=>x.v),pairs.findIndex(x=>x.ok)];
}

function select(topic,n){

 const levels=difficulty==='Kolay'?['Kolay','Orta']:difficulty==='Orta'?['Orta','Kolay','Zor']:['Zor','Orta'];
 const key=topic+'|'+difficulty;
 const history=seenHistory[key]||(seenHistory[key]=[]);
 let candidates=bank.filter(x=>levels.includes(x.level));
 if(difficulty==='Zor')candidates=candidates.filter(x=>x.level==='Zor').concat(candidates.filter(x=>x.level==='Orta'));
 const out=[], usedSkills=new Set();
 for(const item of shuffle(candidates).sort((a,b)=>levels.indexOf(a.level)-levels.indexOf(b.level)||Number(history.includes(a.q))-Number(history.includes(b.q)))){
  if(out.length>=n)break;

  out.push(item);usedSkills.add(item.skill);
 }
 for(const item of shuffle(candidates).sort((a,b)=>Number(history.includes(a.q))-Number(history.includes(b.q)))){
  if(out.length>=n)break;
  if(out.some(x=>x.q===item.q))continue;

 }
 if(out.length<n)throw new Error('Bu konu için yeterli farklı soru yok');
 history.push(...out.map(x=>x.q));
 if(history.length>=candidates.length-12)history.splice(0,Math.max(0,history.length-Math.floor(candidates.length/3)));

}

 const level=document.getElementById('level')?.value||'Orta';
