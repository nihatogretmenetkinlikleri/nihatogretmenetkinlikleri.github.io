<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3. Sınıf Matematik | Renkli Konu Özetleri</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f5ff;color:#24324b;font-family:system-ui,Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:20px}header{background:linear-gradient(120deg,#2464d7,#8c56d7);color:white;padding:22px;border-radius:18px;margin-bottom:16px}h1{font-size:clamp(21px,4vw,31px);margin:0 0 8px}header p{margin:0}.panel{background:white;border:1px solid #dce5f3;border-radius:15px;padding:17px;margin-bottom:16px}.controls{display:grid;grid-template-columns:2fr 1fr;gap:12px}label{display:block;font-weight:700;margin-bottom:6px}select,button{font:inherit;border-radius:10px;padding:11px}select{width:100%;border:1px solid #aabbd6;background:white}button{cursor:pointer;border:1px solid #c6d3e9;background:#fff;color:#173f84;font-weight:700}.active,.primary{background:#2464d7;color:#fff;border-color:#2464d7}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.preview{text-align:center}.preview img{width:100%;max-width:620px;height:auto;box-shadow:0 3px 20px #24324b25;border-radius:5px}.muted{color:#62708b;font-size:14px}.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.thumbs button{padding:8px 12px}.copy{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.print-sheet{display:none}@media(max-width:650px){.controls{grid-template-columns:1fr}.wrap{padding:10px}}
@page{size:A4 portrait;margin:0}@media print{body>main{display:none!important}.print-sheet{display:grid!important;width:210mm;height:297mm;page-break-after:always;break-after:page;overflow:hidden;gap:0;padding:0;margin:0;align-items:center;justify-items:center}.print-sheet.c1{grid-template-columns:1fr;grid-template-rows:1fr}.print-sheet.c2{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.print-sheet.c4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.print-sheet img{display:block;width:100%;height:100%;object-fit:contain}.print-sheet:last-child{page-break-after:auto;break-after:auto}}
</style></head><body><main class="wrap"><header><h1>📘 3. Sınıf Matematik – Renkli Konu Özetleri</h1><p>Konu seç • Görseli aç • 1, 2 veya 4 kopya yazdır</p></header><section class="panel"><div class="controls"><div><label for="topic">Konu seç</label><select id="topic"></select></div><div><label for="page">Sayfa seç</label><select id="page"></select></div></div><div class="buttons"><button id="cover">Kitap kapağı</button><button id="open">Görseli yeni sekmede aç</button><button id="all">Konunun tüm sayfalarını yazdır</button></div></section><section class="panel"><label>Bir A4'e kaç kopya?</label><div class="copy" id="copies"><button data-n="1" class="active">1 kopya</button><button data-n="2">2 kopya</button><button data-n="4">4 kopya</button></div><div class="buttons"><button id="print" class="primary">🖨 Seçili sayfayı yazdır</button></div><p class="muted">Yazdırırken kâğıt: A4, yön: dikey, ölçek: %100; tarayıcı üstbilgi/altbilgilerini kapatın. Görseller GitHub’daki matematik-gorselleri klasöründen yüklenir.</p></section><section class="panel preview"><p id="caption"></p><img id="preview" alt="Matematik konu özeti" loading="eager"></section></main><div id="printarea"></div><script>
const topics=[{"name": "Sayıları Okuma ve Yazma", "pages": [2]}, {"name": "Sayıları Çözümleme", "pages": [3]}, {"name": "Sayıları Sıralama ve Yuvarlama", "pages": [4]}, {"name": "Ritmik Sayma", "pages": [5, 6]}, {"name": "Tek ve Çift Sayılar", "pages": [7]}, {"name": "Tek ve Çift Sayılarla Toplama", "pages": [8]}, {"name": "Sayı ve Şekil Örüntüleri", "pages": [9]}, {"name": "Nesnelerin Sayılarını Tahmin Etme", "pages": [10]}, {"name": "Bütün, Yarım ve Çeyrek", "pages": [11]}, {"name": "Bir Bütünün Uygun Eş Parçaları", "pages": [12]}, {"name": "Pay ve Payda Arasındaki İlişki", "pages": [13]}, {"name": "Analog ve Dijital Saatler", "pages": [14]}, {"name": "Zaman Ölçü Birimleri", "pages": [15]}, {"name": "Zaman Ölçü Birimleri (2)", "pages": [16]}, {"name": "Olayların Oluş Sürelerini Tahmin Etme", "pages": [17]}, {"name": "Uzunluk Ölçü Birimleri", "pages": [18]}, {"name": "Kütle Ölçü Birimleri", "pages": [19]}, {"name": "Madeni ve Kâğıt Paralar", "pages": [20, 21]}, {"name": "Toplama İşleminin Özellikleri", "pages": [22]}, {"name": "Toplama ve Çıkarma İşlemleri", "pages": [23, 24]}];let selected=0,copyCount=1,cover=false;const $=id=>document.getElementById(id);const src=n=>'matematik-gorselleri/sayfa-'+String(n).padStart(2,'0')+'.png';
function init(){topics.forEach((t,i)=>{let o=document.createElement('option');o.value=i;o.textContent=t.name;$('topic').append(o)});$('topic').onchange=()=>{selected=+$('topic').value;cover=false;renderPages()};$('page').onchange=()=>{cover=false;preview()};$('copies').onclick=e=>{let b=e.target.closest('button[data-n]');if(!b)return;copyCount=+b.dataset.n;document.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('active',x===b))};$('cover').onclick=()=>{cover=true;preview()};$('open').onclick=()=>window.open(src(current()),'_blank','noopener');$('print').onclick=()=>printPages([current()]);$('all').onclick=()=>printPages(topics[selected].pages);renderPages()}
function current(){return cover?1:+$('page').value}function renderPages(){let sel=$('page');sel.replaceChildren();topics[selected].pages.forEach((p,i)=>{let o=document.createElement('option');o.value=p;o.textContent='Sayfa '+(i+1)+' (kitapçık: '+p+')';sel.append(o)});preview()}
function preview(){$('preview').onerror=()=>{$('caption').textContent='Görsel yüklenemedi: '+src(current())+' — GitHub dosya adını kontrol edin.'};$('preview').onload=()=>{$('caption').textContent=cover?'Kitap kapağı':topics[selected].name+' · Kitapçık sayfası '+current()};$('preview').src=src(current());$('caption').textContent=cover?'Kitap kapağı':topics[selected].name+' · Kitapçık sayfası '+current()}
function printPages(pages){let area=$('printarea');area.replaceChildren();for(const p of pages){let sheet=document.createElement('div');sheet.className='print-sheet c'+copyCount;for(let i=0;i<copyCount;i++){let im=document.createElement('img');im.src=src(p);sheet.append(im)}area.append(sheet)}let images=[...area.querySelectorAll('img')];Promise.all(images.map(im=>im.decode().then(()=>true).catch(()=>false))).then(results=>{if(results.some(x=>!x)){alert('Bazı görseller yüklenemedi. GitHub klasöründeki dosyaları kontrol edin.');return}window.print()})}
window.addEventListener('DOMContentLoaded',init);
</script></body></html>
