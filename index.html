<script>
const toast=document.getElementById('toast');
function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}
document.querySelectorAll('[data-soon]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();showToast(a.dataset.soon)}));
document.getElementById('timer').addEventListener('click',e=>{
 e.preventDefault();
 let left=300;
 const old=document.getElementById('timerbox'); if(old) old.remove();
 const box=document.createElement('div');box.id='timerbox';
 Object.assign(box.style,{position:'fixed',inset:'0',background:'#17345ff2',zIndex:'100',display:'grid',placeItems:'center',color:'white',fontFamily:'Arial'});
 box.innerHTML='<div style="text-align:center"><div style="font-size:22px;font-weight:800;margin-bottom:12px">⏱️ 5 Dakika Sayaç</div><div id="clock" style="font-size:min(22vw,130px);font-weight:900">05:00</div><button id="closeT" style="margin-top:18px;padding:12px 24px;border:0;border-radius:999px;font-weight:800">Kapat</button></div>';
 document.body.appendChild(box);
 const clock=box.querySelector('#clock');
 const id=setInterval(()=>{left--; let m=Math.floor(left/60),s=left%60;clock.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(left<=0){clearInterval(id);clock.textContent='SÜRE BİTTİ!'}},1000);
 box.querySelector('#closeT').onclick=()=>{clearInterval(id);box.remove()};
});
</script>
